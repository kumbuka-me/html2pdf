name: html2pdf

services:
  html2pdf:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: ${HTML2PDF__BUILD_VERSION:-dev}
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      HTML2PDF__TOKEN: ${HTML2PDF__TOKEN:-}
      HTML2PDF__ALLOW_UNAUTHENTICATED: ${HTML2PDF__ALLOW_UNAUTHENTICATED:-false}
      HTML2PDF__WORKERS: ${HTML2PDF__WORKERS:-2}
      HTML2PDF__TIMEOUT: ${HTML2PDF__TIMEOUT:-45}
      HTML2PDF__ASSET_POLICY: ${HTML2PDF__ASSET_POLICY:-embedded}
      HTML2PDF__REMOTE_ASSET_HOSTS: ${HTML2PDF__REMOTE_ASSET_HOSTS:-}
      HTML2PDF__ALLOW_PRIVATE_REMOTE_ASSETS: ${HTML2PDF__ALLOW_PRIVATE_REMOTE_ASSETS:-false}
      HTML2PDF__MAX_HTML_BYTES: ${HTML2PDF__MAX_HTML_BYTES:-33554432}
      HTML2PDF__MAX_PDF_BYTES: ${HTML2PDF__MAX_PDF_BYTES:-67108864}
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 2
    restart: unless-stopped
