---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: html2pdf
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: html2pdf
  template:
    metadata:
      labels:
        app.kubernetes.io/name: html2pdf
    spec:
      containers:
        - name: html2pdf
          image: ghcr.io/kumbuka-me/html2pdf:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: HTML2PDF__TOKEN
              valueFrom:
                secretKeyRef:
                  name: html2pdf-auth
                  key: token
            - name: HTML2PDF__ALLOW_UNAUTHENTICATED
              value: "false"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
